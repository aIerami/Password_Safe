'use strict';
/*CRYPTO-BEGIN*/
// ---- Шифрование: только встроенный Web Crypto API ----
const KDF_ITER = 600000;          // число итераций PBKDF2-SHA256
const KDF_MIN = 600000, KDF_MAX = 5000000;
const _enc = new TextEncoder(), _dec = new TextDecoder();

function toB64(u8) {

  return btoa(s);

function fromB64(str) {
  const s = atob(str), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);

}
function rndBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); }

async function deriveKey(password, salt, iter) {

    { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },

// Проверка структуры файла/хранилища. Бросает Error('FORMAT').

    if (fromB64(b.salt).length !== 16 || fromB64(b.iv).length !== 12 || fromB64(b.ct).length < 17) throw 0;
  } catch (e) { throw new Error('FORMAT'); }

// Шифрует объект. Для каждого сохранения новый случайный IV.
async function sealData(obj, key, salt, iter) {
  const iv = rndBytes(12);
  const ct = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv: iv, additionalData: aadFor(iter), tagLength: 128 },
    key, _enc.encode(JSON.stringify(obj)));
  return { app: 'sejf', v: 1, kdf: 'PBKDF2-SHA256', iter: iter, salt: toB64(salt), iv: toB64(iv), ct: toB64(new Uint8Array(ct)) };

// Расшифровывает. Неверный ключ или любое повреждение -> Error('AUTH').
async function openData(blob, key) {
  checkBlob(blob);
  let pt;

    pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromB64(blob.iv), additionalData: aadFor(blob.iter), tagLength: 128 },
      key, fromB64(blob.ct));

  try { return JSON.parse(_dec.decode(pt)); } catch (e) { throw new Error('AUTH'); }

  const salt = rndBytes(16), iter = KDF_ITER;
  const key = await deriveKey(password, salt, iter);
  const blob = await sealData(data, key, salt, iter);
  return { blob: blob, key: key, salt: salt, iter: iter, data: data };
}
// Проверка пароля = попытка расшифровки.
async function unlockVault(password, blob) {
  checkBlob(blob);
  const salt = fromB64(blob.salt);
  const key = await deriveKey(password, salt, blob.iter);
  const data = await openData(blob, key);
  if (!data || !Array.isArray(data.entries)) throw new Error('AUTH');
  return { key: key, salt: salt, iter: blob.iter, data: data };

/*UTIL-BEGIN*/
// ---- Генератор паролей (crypto.getRandomValues, без смещения) ----

const SETS = {

    if (s) sets.push(s);

  return Math.round(o.len * Math.log2(n || 26));

// ---- Оценка надёжности мастер-пароля (консервативная, в битах) ----
const ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', 'йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю', '1234567890'];
const COMMON = ['password', 'qwerty', 'пароль', 'йцукен', '123456', 'admin', 'letmein', '111111', 'qazwsx', 'iloveyou', 'master', 'welcome', 'abc123', '000000'];

  if (/[А-ЯЁ]/.test(pw)) pool += 33;

    const a = lc[i].codePointAt(0), b = lc[i + 1].codePointAt(0), c = lc[i + 2].codePointAt(0);
    if ((b - a === 1 && c - b === 1) || (a - b === 1 && b - c === 1)) mark[i] = mark[i + 1] = mark[i + 2] = true;
    const tri = lc[i] + lc[i + 1] + lc[i + 2];
    for (const r of ROWS) { if (r.indexOf(tri) >= 0 || r.split('').reverse().join('').indexOf(tri) >= 0) mark[i] = mark[i + 1] = mark[i + 2] = true; }
  }
  const seen = new Set();
  let eff = 0;
  for (let i = 0; i < ch.length; i++) {
    if (mark[i] || seen.has(ch[i])) eff += 0.25; else { seen.add(ch[i]); eff += 1; }
  }

  let bits = eff * per;

}
function strengthLevel(bits, pw) {
  const len = Array.from(pw || '').length;

  else if (bits >= 55) { n = 3; text = 'Хороший'; }
  else if (bits >= 40) { n = 2; text = 'Средний'; }
  return { n: n, text: text, ok: bits >= 55 && len >= 10 };

// ---- Слияние записей при импорте ----
function mergeEntries(cur, inc) {
  const out = cur.slice();
  let added = 0, updated = 0;
  for (const e of inc) {
    const i = out.findIndex(x => x.id === e.id);
    if (i >= 0) { if ((e.updated || 0) > (out[i].updated || 0)) { out[i] = e; updated++; } continue; }
    const dup = out.some(x => x.title === e.title && x.login === e.login && x.password === e.password);
    if (!dup) { out.push(e); added++; }

// ---- Категории ----
function normCat(n) { return String(n || '').replace(/\s+/g, ' ').trim().slice(0, 30); }

const SCREENS = {};
function render(force) {
  if (S.tick) { clearInterval(S.tick); S.tick = 0; }
  let page = null;
  for (let i = S.stack.length - 1; i >= 0; i--) if (S.stack[i].n !== 'dlg') { page = S.stack[i]; break; }
  if (!page) return;
  if (force || S.shown !== page) {
    const app = $('app');
    const old = S.shown && S.shown.n === 'list' ? app.querySelector('.list') : null;
    if (old) S.listScroll = old.scrollTop;

  }

// ---------- защита от подбора ----------
function guardGet() { const g = jget(LS.guard, { fails: 0, until: 0 }); if (g.until - Date.now() > 900000) g.until = Date.now() + 900000; return g; }
function guardFail() {
  const g = guardGet(); g.fails++;
  const d = g.fails < 3 ? 0 : Math.min(900, 5 * Math.pow(2, g.fails - 3));
  g.until = d ? Date.now() + d * 1000 : 0; lsSet(LS.guard, JSON.stringify(g)); return g;
}
function guardOk() { lsDel(LS.guard); }

// ---------- сохранение ----------
async function save() {
  const blob = await sealData(S.data, S.key, S.salt, S.iter);
  if (!lsSet(LS.vault, JSON.stringify(blob))) throw new Error('STORE');
  const m = jget(LS.meta, {}); m.dirty = true; lsSet(LS.meta, JSON.stringify(m));
}
function startSession(r) {
  ensureCats(r.data);
  S.key = r.key; S.salt = r.salt; S.iter = r.iter; S.data = r.data; S.q = ''; S.cat = ''; S.listScroll = 0;
  resetTo('list');
}
function lock() {
  S.key = null; S.salt = null; S.data = null; S.q = ''; S.cat = ''; S.graceUntil = 0;
  try { if (window.VaultNative) window.VaultNative.clearNow(); } catch (e) { }
  $('toast').style.display = 'none';
  resetTo(hasVault() ? 'unlock' : 'setup');
}
function entryById(id) { return S.data.entries.find(e => e.id === id); }
// Список категорий хранится внутри зашифрованного хранилища (data.cats).
function ensureCats(d) {
  d.cats = Array.isArray(d.cats) ? mergeCats([], d.cats) : DEF_CATS.slice();
  if (!d.cats.length) d.cats.push('Общее');
  for (const e of d.entries) {
    e.cat = normCat(e.cat) || d.cats[0];
    if (catIndex(d.cats, e.cat) < 0) d.cats.push(e.cat);
  }
}
function allCats() { return S.data.cats; }
// Изменение данных с откатом, если сохранить не удалось
async function mutate(fn) {
  const snap = JSON.stringify(S.data);
  fn();
  try { await save(); return true; } catch (e) { S.data = JSON.parse(snap); return false; }
}

// ---------- буфер обмена ----------
let clipT = 0;
function copySecret(text, what) {
  if (window.VaultNative && window.VaultNative.copy) {
    try { window.VaultNative.copy(String(text), CLIP_SEC); toast(what + ' скопирован. Буфер очистится через ' + CLIP_SEC + ' с'); return; } catch (e) { }
  }
  const done = () => {
    toast(what + ' скопирован. Буфер очистится через ' + CLIP_SEC + ' с');
    clearTimeout(clipT); clipT = setTimeout(() => { try { navigator.clipboard.writeText(' '); } catch (e) { } }, CLIP_SEC * 1000);
  };
  try { navigator.clipboard.writeText(String(text)).then(done, () => toast('Не удалось скопировать')); } catch (e) { toast('Не удалось скопировать'); }
}

// ---------- автоблокировка ----------
function checkResume(ms) {
  if (S.key && ms >= LOCK_MS && Date.now() > S.graceUntil) lock();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    S.hiddenAt = Date.now();

  } else {
    if (S.hiddenAt) checkResume(Date.now() - S.hiddenAt);

  }
});
window.__resumed = ms => checkResume(ms);   // вызывается из Android-кода

// ---- Вход ----
SCREENS.unlock = function () {
  const pw = pwBox('Мастер-пароль');
  const msg = h('div', { class: 'msg' });
  const go1 = btn('Открыть', 'pri', null);
  let busy = false, waiting = false;
  const form = h('form', { autocomplete: 'off', onsubmit: e => { e.preventDefault(); attempt(); } }, pw.wrap, msg, h('button', { type: 'submit', style: 'display:none' }));
  go1.addEventListener('click', attempt);
  function tick() {
    const left = Math.ceil((guardGet().until - Date.now()) / 1000);
    if (left > 0) { waiting = true; go1.disabled = true; msg.textContent = 'Слишком много неверных попыток. Подождите ' + fmtWait(left); }
    else if (waiting) { waiting = false; if (!busy) go1.disabled = false; msg.textContent = ''; }
  }
  async function attempt() {
    if (busy || waiting || !pw.inp.value) return;
    busy = true; go1.disabled = true; go1.textContent = 'Проверка…'; msg.textContent = ''; await sleepFrame();
    let blob = null;
    try { blob = JSON.parse(lsGet(LS.vault)); } catch (e) { }
    try {
      const r = await unlockVault(pw.inp.value, blob);
      guardOk();
      if (r.iter < KDF_ITER) await upgradeKdf(pw.inp.value, r);
      startSession(r); return;
    } catch (e) {
      if (e.message === 'FORMAT') msg.textContent = 'Файл хранилища повреждён. Нажмите «Забыли пароль?», сбросьте сейф и восстановите его из резервной копии.';
      else { const g = guardFail(); msg.textContent = 'Неверный пароль (или данные повреждены).' + (g.fails >= 3 ? ' Попыток подряд: ' + g.fails + '.' : ''); }
    }
    pw.inp.value = ''; busy = false; go1.textContent = 'Открыть'; go1.disabled = false; tick();
  }
  async function upgradeKdf(password, r) {
    try { const n = await createVault(password, r.data); await sleepFrame(); lsSet(LS.vault, JSON.stringify(n.blob)); r.key = n.key; r.salt = n.salt; r.iter = n.iter; } catch (e) { }
  }
  S.tick = setInterval(tick, 500); tick();
  return h('div', { class: 'scr grid' },
    h('div', { class: 'body' }, logo(), h('h2', { class: 'h2' }, 'Сейф паролей'), h('p', { class: 'lead' }, 'Введите мастер-пароль'), form,
      go1, h('div', { style: 'height:10px' }), btn('Забыли пароль?', 'ghost', openReset)));
};
function openReset() {
  const inp = textInp('', 'Введите слово УДАЛИТЬ');
  dialog('Забыли мастер-пароль?', [
    h('p', {}, 'Восстановить пароль невозможно: данные зашифрованы им. Единственный выход: стереть сейф и загрузить резервную копию (понадобится пароль от неё).'),
    h('div', { class: 'fld' }, inp)], [
    { t: 'Стереть сейф', cls: 'bad', fn: close => { if (inp.value.trim().toUpperCase() !== 'УДАЛИТЬ') { toast('Введите слово УДАЛИТЬ'); return; } wipeAll(); } },
    { t: 'Отмена', fn: close => close() }]);
}

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function makeBackupText() {
  const blob = await sealData(S.data, S.key, S.salt, S.iter);
  blob.type = 'backup';
  return JSON.stringify(blob);
}
function markBackup() { const m = jget(LS.meta, {}); m.last = Date.now(); m.dirty = false; lsSet(LS.meta, JSON.stringify(m)); }
function capPlugins() { return window.Capacitor && window.Capacitor.Plugins ? window.Capacitor.Plugins : {}; }
function isNative() { try { return !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() !== 'web'); } catch (e) { return false; } }
async function exportBackup() {
  S.graceUntil = Date.now() + GRACE_MS;
  const text = await makeBackupText(), name = 'sejf-' + todayStr() + '.sejf';
  const P = capPlugins();
  if (P.Filesystem && P.Share) {
    try {
      const r = await P.Filesystem.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
      await P.Share.share({ title: 'Резервная копия сейфа', files: [r.uri], dialogTitle: 'Куда сохранить копию' });
      markBackup(); toast('Готово. Убедитесь, что файл сохранён (Диск, Telegram, «Файлы»).', 4500); return;
    } catch (e) {
      if (/cancel/i.test(String(e && (e.message || e)))) return;
    }
  } else if (!isNative()) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' })), download: name });
    document.body.append(a); a.click(); a.remove(); markBackup(); toast('Файл скачан'); return;
  }
  dialog('Не удалось поделиться файлом', [h('p', {}, 'Можно скопировать копию как текст и сохранить его, например, в «Избранное» Telegram или в заметки. Текст зашифрован.')], [
    { t: 'Скопировать как текст', cls: 'pri', fn: async close => { try { await navigator.clipboard.writeText(text); markBackup(); toast('Текст копии скопирован'); } catch (e) { toast('Не удалось скопировать'); } close(); } },
    { t: 'Закрыть', fn: close => close() }]);
}
async function copyBackupText() {
  try { await navigator.clipboard.writeText(await makeBackupText()); markBackup(); toast('Зашифрованный текст копии скопирован'); } catch (e) { toast('Не удалось скопировать'); }
}
function pickFile(cb) {

// mode: 'restore' (первый запуск) или 'merge' (внутри открытого сейфа)
function startImport(text, mode) {
  let blob;
  try { blob = JSON.parse(String(text).trim()); checkBlob(blob); } catch (e) { toast('Это не файл резервной копии сейфа'); return; }
  const pw = pwBox('Пароль от этой копии'), msg = h('div', { class: 'msg' });
  async function run(how, close, b) {
    if (!pw.inp.value) { msg.textContent = 'Введите пароль'; return; }
    b.disabled = true; msg.className = 'msg ok'; msg.textContent = 'Проверка…'; await sleepFrame();
    let r;
    try { r = await unlockVault(pw.inp.value, blob); } catch (e) { msg.className = 'msg'; msg.textContent = 'Неверный пароль или файл повреждён'; b.disabled = false; return; }
    if (how === 'restore') {
      if (!lsSet(LS.vault, JSON.stringify(blob))) { msg.className = 'msg'; msg.textContent = 'Не удалось сохранить'; b.disabled = false; return; }
      guardOk(); const m = jget(LS.meta, {}); m.last = Date.now(); m.dirty = false; lsSet(LS.meta, JSON.stringify(m));
      close(); setTimeout(() => { startSession(r); toast('Сейф восстановлен: записей ' + r.data.entries.length); }, 80); return;
    }
    if (!S.key) { close(); toast('Сейф был заблокирован. Откройте его и повторите'); return; }
    const before = S.data.entries.slice(), beforeCats = S.data.cats.slice();
    if (how === 'replace') { S.data.entries = r.data.entries; S.data.cats = r.data.cats || []; }
    else { S.data.entries = mergeEntries(before, r.data.entries).entries; S.data.cats = mergeCats(S.data.cats, r.data.cats); }
    ensureCats(S.data);
    try { await save(); } catch (e) { S.data.entries = before; S.data.cats = beforeCats; msg.className = 'msg'; msg.textContent = 'Не удалось сохранить'; b.disabled = false; return; }
    const added = S.data.entries.length - (how === 'replace' ? 0 : before.length);
    close(); setTimeout(() => { render(true); toast(how === 'replace' ? 'Записи заменены: ' + S.data.entries.length : 'Добавлено записей: ' + Math.max(0, added)); }, 80);
  }
  const wrapped = [];
  if (mode === 'restore') wrapped.push({ t: 'Восстановить', cls: 'pri', fn: (c, el) => run('restore', c, el) });
  else {
    wrapped.push({ t: 'Добавить к моим записям', cls: 'pri', fn: (c, el) => run('merge', c, el) });
    wrapped.push({ t: 'Заменить мои записи копией', cls: 'bad', fn: (c, el) => run('replace', c, el) });
  }
  wrapped.push({ t: 'Отмена', fn: c => c() });
  dialog(mode === 'restore' ? 'Восстановление из копии' : 'Загрузка копии', [h('p', {}, 'Введите мастер-пароль, который был у сейфа в момент создания этой копии.'), h('div', { class: 'fld' }, pw.wrap), msg], wrapped);
}

SCREENS.chpass = function () {
  const cur = pwBox('Текущий пароль'), n1 = pwBox('Новый пароль', upd), n2 = pwBox('Новый пароль ещё раз', upd);
  const m = meter(() => n1.inp.value), msg = h('div', { class: 'msg' });
  const go1 = btn('Сменить пароль', 'pri', run); go1.disabled = true;
  function upd() {
    const lv = m.upd(), a = n1.inp.value, b = n2.inp.value;
    msg.className = 'msg'; msg.textContent = a && !lv.ok ? 'Слишком простой: нужно 10+ символов и уровень «Хороший».' : (b && a !== b ? 'Пароли не совпадают' : '');
    go1.disabled = !(lv.ok && a === b && cur.inp.value);
  }
  cur.inp.addEventListener('input', upd);
  async function run() {
    go1.disabled = true; msg.className = 'msg ok'; msg.textContent = 'Перешифровка…'; await sleepFrame();
    try {
      let stored; try { stored = JSON.parse(lsGet(LS.vault)); } catch (e) { throw new Error('FORMAT'); }
      await unlockVault(cur.inp.value, stored);                       // проверка текущего пароля расшифровкой
    } catch (e) { msg.className = 'msg'; msg.textContent = 'Текущий пароль неверен'; go1.disabled = false; return; }
    try {
      const r = await createVault(n1.inp.value, S.data);              // новая соль, новый ключ, новый IV
      await unlockVault(n1.inp.value, r.blob);                         // контрольная расшифровка перед записью
      if (!lsSet(LS.vault, JSON.stringify(r.blob))) throw new Error('STORE');
      S.key = r.key; S.salt = r.salt; S.iter = r.iter;
      const mt = jget(LS.meta, {}); mt.dirty = true; lsSet(LS.meta, JSON.stringify(mt));
      backN(1); setTimeout(() => toast('Пароль изменён. Сделайте новую резервную копию', 4500), 150);
    } catch (e) { msg.className = 'msg'; msg.textContent = 'Не удалось сменить пароль. Старый пароль продолжает действовать.'; go1.disabled = false; }
  }
  return h('div', { class: 'scr' }, header('Смена пароля'),

    h('div', { class: 'bar' }, go1));
};
